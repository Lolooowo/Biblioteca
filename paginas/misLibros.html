    <div class="books-grio" id="librosGrid"></div>

  <div class="modal-overlay" id="menuLibro">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Detalles del Libro</h2>
        <button class="close-modal" id="cerrarMenu">&times;</button>
      </div>
      <div class="modal-body">
        <div class="book-details">

          <div class="book-details-info">
            <h3 class="book-details-title" id="tituloLibro"></h3>
            <p class="book-details-author" id="autorLibro"></p>
          </div>
        </div>
        <p class="book-description" id="descripcionLibro">
          aqui va la descripcion del libro en el java.
        </p>
        <div class="modal-actions">
          <button class="action-button primary" id="leidosEliminar">

        </div>
      </div>
